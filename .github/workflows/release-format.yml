name: Release World Mirror Format

on:
  push:
    tags:
      - 'world-mirror-format-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing format tag to retry (for example, world-mirror-format-v0.1.0)'
        required: true
        type: string

concurrency:
  group: release-format-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Checkout format release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate format version and extract release notes
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F"'" '/^version = / { print $2 }' world-mirror-format/build.gradle)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$RELEASE_TAG" = "world-mirror-format-v$version"
          awk -v header="## world-mirror-format [$version]" '
            /^## / { if (found) exit; found = index($0, header) == 1 }
            found && /^---$/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          printf 'version=%s\ntag=%s\n' "$version" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Build format ZIP and checksum
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew -p world-mirror-format releaseBundle
          zip="world-mirror-format/build/distributions/world-mirror-format-$VERSION.zip"
          test -f "$zip"
          test -f "$zip.sha256"
          (cd "$(dirname "$zip")" && sha256sum --check "$(basename "$zip").sha256")
          jar="world-mirror-format/build/libs/world-mirror-format-$VERSION.jar"
          sources="world-mirror-format/build/libs/world-mirror-format-$VERSION-sources.jar"
          test -f "$jar"
          test -f "$sources"
          (cd "$(dirname "$jar")" && sha256sum "$(basename "$jar")" "$(basename "$sources")" > "world-mirror-format-$VERSION-jars.sha256")
          mkdir -p build/release-format
          cp "$zip" "$zip.sha256" "$jar" "$sources" \
            "world-mirror-format/build/libs/world-mirror-format-$VERSION-jars.sha256" \
            release-notes.md build/release-format/

      - name: Upload format release bundle
        uses: actions/upload-artifact@v4
        with:
          name: format-release-${{ steps.metadata.outputs.tag }}
          path: build/release-format/
          if-no-files-found: error
          retention-days: 7

  publish-github:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download format release bundle
        uses: actions/download-artifact@v4
        with:
          name: format-release-${{ needs.build.outputs.tag }}
          path: build/release-format

      - name: Create or update format GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: World Mirror Format ${{ needs.build.outputs.version }}
          body_path: build/release-format/release-notes.md
          make_latest: false
          files: |
            build/release-format/*.zip
            build/release-format/*.jar
            build/release-format/*.sha256
          fail_on_unmatched_files: true
