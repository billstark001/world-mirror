name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to retry (for example, v0.5.4)'
        required: true
        type: string
      publish_modrinth:
        description: 'Publish the configured Modrinth versions when a token is configured'
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      channel: ${{ steps.metadata.outputs.channel }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      publish_modrinth: ${{ steps.metadata.outputs.publish_modrinth }}
      minecraft: ${{ steps.artifacts.outputs.minecraft }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Checkout release tooling for a retry
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-workflow
          sparse-checkout: .github/scripts

      - name: Validate and derive release metadata
        id: metadata
        shell: bash
        env:
          TOOLING_ROOT: ${{ github.event_name == 'workflow_dispatch' && '.release-workflow' || '.' }}
          WANT_MODRINTH: ${{ github.event_name == 'push' || inputs.publish_modrinth }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          HAS_MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          bash "$TOOLING_ROOT/.github/scripts/release-metadata.sh" mod "$RELEASE_TAG" "$GITHUB_OUTPUT" release-notes.md

          publish_modrinth=false
          if [[ "$WANT_MODRINTH" == "true" \
                && -n "$MODRINTH_PROJECT_ID" \
                && "$HAS_MODRINTH_TOKEN" == "true" ]]; then
            publish_modrinth=true
          elif [[ "$WANT_MODRINTH" == "true" ]]; then
            if [[ -z "$MODRINTH_PROJECT_ID" ]]; then
              echo '::notice::MODRINTH_PROJECT_ID repository variable is not configured; skipping Modrinth publishing.'
            fi
            if [[ "$HAS_MODRINTH_TOKEN" != "true" ]]; then
              echo '::notice::MODRINTH_TOKEN is not configured; skipping Modrinth publishing.'
            fi
          fi

          echo "publish_modrinth=$publish_modrinth" >> "$GITHUB_OUTPUT"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Verify target bridge artifacts
        run: |
          chmod +x ./gradlew
          ./gradlew verifyBridgeMatrix

      - name: Build all targets once
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          chmod +x ./gradlew
          ./gradlew -Pmod_version="$VERSION" collectArtifacts

      - name: Collect and validate distributable JARs
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release
          mv release-notes.md build/release/
          cp build/distributions/*.jar build/release/
          expected="$(jq '.targets | length' build/target-manifest.json)"
          test "$(find build/release -maxdepth 1 -name '*.jar' -type f | wc -l)" -eq "$expected"
          echo "minecraft=$(jq -c '[.targets[].minecraft]' build/target-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.metadata.outputs.tag }}
          path: build/release/
          if-no-files-found: error
          retention-days: 7

  publish-github:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: build/release

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: World Mirror ${{ needs.build.outputs.tag }}
          body_path: build/release/release-notes.md
          prerelease: ${{ needs.build.outputs.prerelease }}
          files: build/release/*.jar
          fail_on_unmatched_files: true

  publish-modrinth:
    needs: build
    if: ${{ needs.build.outputs.publish_modrinth == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        minecraft: ${{ fromJSON(needs.build.outputs.minecraft) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: build/release

      - name: Publish Minecraft ${{ matrix.minecraft }} to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/release/world-mirror-${{ needs.build.outputs.version }}+${{ matrix.minecraft }}-fabric.jar
          name: World Mirror ${{ needs.build.outputs.tag }} for Minecraft ${{ matrix.minecraft }}
          version: ${{ needs.build.outputs.version }}+${{ matrix.minecraft }}-fabric
          version-type: ${{ needs.build.outputs.channel }}
          changelog-file: build/release/release-notes.md
          game-versions: ${{ matrix.minecraft }}
          game-version-filter: none
          loaders: fabric
          environment: client
          dependencies: fabric-api(required)
