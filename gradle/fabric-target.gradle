def target = rootProject.ext.targets[project.ext.minecraftTarget]
def sharedMinecraft = target.sharedMinecraft ?: target.minecraft
def bridgeJar = rootProject.file("libs/xaero-world-map-bridge-${target.minecraft}.jar")
def commonJava = objects.sourceDirectorySet("commonJava${target.minecraft}",
        "Common Java sources for Minecraft ${target.minecraft}")
commonJava.srcDir(rootProject.file("src/main/java"))
commonJava.exclude(target.commonOverrides ?: [])
def sharedJava = objects.sourceDirectorySet("sharedJava${target.minecraft}",
        "Shared Java sources for Minecraft ${sharedMinecraft}")
sharedJava.srcDir(rootProject.file("versions/shared-mc-${sharedMinecraft}/src/main/java"))
sharedJava.exclude(target.sharedOverrides ?: [])

def verifyXaeroBridge = tasks.register("verifyXaeroBridge") {
    group = "verification"
    description = "Checks that the Xaero bridge JAR matches Minecraft ${target.minecraft}."
    doLast {
        if (!bridgeJar.isFile()) {
            throw new GradleException("Missing ${bridgeJar.name}; supply the Minecraft ${target.minecraft} Fabric bridge JAR")
        }
        new java.util.zip.ZipFile(bridgeJar).withCloseable { archive ->
            def entry = archive.getEntry("fabric.mod.json")
            if (entry == null) {
                throw new GradleException("${bridgeJar.name} has no fabric.mod.json")
            }
            def metadata = new groovy.json.JsonSlurper().parseText(
                    archive.getInputStream(entry).getText("UTF-8"))
            def expectedVersion = "${rootProject.xaero_bridge_version}+${target.minecraft}-fabric"
            def bridgeVersion = metadata.version?.toString()
            def minecraftRequirement = metadata.depends?.minecraft?.toString()
            def xaeroRequirement = metadata.depends?.xaeroworldmap?.toString()
            def minecraftVersion = target.minecraft.toString()
            def acceptsTarget = minecraftRequirement == minecraftVersion ||
                    minecraftRequirement == "~${minecraftVersion}" ||
                    minecraftRequirement == ">=${minecraftVersion}" ||
                    minecraftRequirement?.startsWith(">=${minecraftVersion} ")
            if (metadata.id != "xaero_world_map_bridge" ||
                    bridgeVersion != expectedVersion || !acceptsTarget ||
                    !xaeroRequirement || xaeroRequirement.contains("<")) {
                throw new GradleException("${bridgeJar.name} is incompatible with Minecraft ${minecraftVersion}: " +
                        "expectedVersion=${expectedVersion}, id=${metadata.id}, version=${bridgeVersion}, " +
                        "depends.minecraft=${minecraftRequirement}, depends.xaeroworldmap=${xaeroRequirement}")
            }
        }
    }
}

tasks.named("compileJava") { dependsOn(verifyXaeroBridge) }
tasks.named("check") { dependsOn(verifyXaeroBridge) }

group = rootProject.mod_group
version = "${rootProject.mod_version}+${target.minecraft}-fabric"

base {
    archivesName = rootProject.archives_base_name
}

repositories {
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.shedaniel.me/" }
    mavenCentral()
}

sourceSets {
    main {
        java.setSrcDirs([])
        java.source(commonJava)
        java.source(sharedJava)
        if (sharedMinecraft != target.minecraft) {
            java.srcDir(rootProject.file("versions/shared-mc-${target.minecraft}/src/main/java"))
        }
        java.srcDir(project.file("src/main/java"))
        resources.srcDirs = [rootProject.file("src/main/resources")]
    }
    test {
        java.srcDirs = [rootProject.file("src/test/java")]
    }
}

loom {
    mods {
        "worldmirror" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            configName = "Minecraft Client ${target.minecraft}"
            getGenerateRunConfig().set(true)
            runDir = rootProject.file("run").absolutePath
        }
    }
}

// Loom's IDEA application template does not select a JRE. Bind each generated
// configuration to the Java version required by its Minecraft target.
tasks.named("ideaSyncTask").configure {
    dependsOn(rootProject.tasks.named("cleanIdeaRunConfigurations"))
    dependsOn(rootProject.tasks.named("verifyBridgeMatrix"))
    doLast {
        def moduleMarker = "<module name=\"${rootProject.name}.versions.fabric-${target.minecraft}.main\""
        def runConfigurationsDirectory = rootProject.file(".idea/runConfigurations")
        if (!runConfigurationsDirectory.isDirectory()) return

        fileTree(runConfigurationsDirectory) {
            include "Minecraft_Client_*fabric-${target.minecraft}.xml"
        }.files.each { runConfigurationFile ->
            def lines = runConfigurationFile.readLines("UTF-8").findAll {
                !it.contains('name="ALTERNATIVE_JRE_PATH"') &&
                    !it.contains('name="ALTERNATIVE_JRE_PATH_ENABLED"')
            }
            if (!lines.any { it.contains(moduleMarker) }) return

            def configurationLine = lines.findIndexOf { it.contains("<configuration ") }
            if (configurationLine < 0) {
                throw new GradleException("Invalid IDEA run configuration: ${runConfigurationFile}")
            }
            lines.add(configurationLine + 1,
                "    <option name=\"ALTERNATIVE_JRE_PATH_ENABLED\" value=\"true\" />")
            lines.add(configurationLine + 1,
                "    <option name=\"ALTERNATIVE_JRE_PATH\" value=\"${target.javaVersion}\" />")
            runConfigurationFile.setText(lines.join(System.lineSeparator()) + System.lineSeparator(), "UTF-8")
        }
    }
}

dependencies {
    implementation include("io.github.billstark001.worldmirror:world-mirror-format:0.1.1")
    compileOnly "com.google.code.gson:gson:${rootProject.gson_version}"
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "com.google.code.gson:gson:${rootProject.gson_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    minecraft "com.mojang:minecraft:${target.minecraft}"

    if (target.remapped) {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
        modCompileOnly "com.terraformersmc:modmenu:${target.modMenu}"
        modRuntimeOnly "com.terraformersmc:modmenu:${target.modMenu}"
        modApi include("me.shedaniel.cloth:cloth-config-fabric:${target.clothConfig}") {
            exclude(group: "net.fabricmc.fabric-api")
        }
        modImplementation files(bridgeJar)
    } else {
        implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
        compileOnly "com.terraformersmc:modmenu:${target.modMenu}"
        runtimeOnly "com.terraformersmc:modmenu:${target.modMenu}"
        api include("me.shedaniel.cloth:cloth-config-fabric:${target.clothConfig}") {
            exclude(group: "net.fabricmc.fabric-api")
        }
        implementation files(bridgeJar)
    }

    implementation include("org.xerial:sqlite-jdbc:${rootProject.sqlite_version}")

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test") {
    useJUnitPlatform()
}

tasks.register("printRuntimeClasspath") {
    group = "help"
    description = "Print resolved runtime JAR paths for tooling that inspects this Minecraft target."
    doLast {
        configurations.runtimeClasspath.files.each { println it.absolutePath }
    }
}

def resourceProperties = [
    version: project.version,
    minecraftRange: target.minecraftRange,
    loaderVersion: rootProject.loader_version,
    javaVersion: target.javaVersion,
    mixinJava: target.mixinJava,
    clothConfigVersion: target.clothConfig
]

processResources {
    inputs.properties(resourceProperties)
    filesMatching("fabric.mod.json") { expand(resourceProperties) }
    filesMatching("worldmirror*.mixins.json") { expand(resourceProperties) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = target.javaVersion
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(target.javaVersion)
    sourceCompatibility = JavaVersion.toVersion(target.javaVersion)
    targetCompatibility = JavaVersion.toVersion(target.javaVersion)
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${rootProject.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }
}
